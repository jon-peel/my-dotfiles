conky.config = {
    -- Window
    own_window           = true,
    own_window_type      = 'normal',
    own_window_hints     = 'undecorated,below,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value  = 210,
    own_window_colour    = 'D8EDD8',

    -- Position
    alignment = 'top_right',
    gap_x     = 20,
    gap_y     = 48,

    -- Font / text
    use_xft   = true,
    font      = 'IBM Plex Mono:size=9',
    xftalpha  = 1,

    -- Behaviour
    background         = true,
    update_interval    = 86400,
    double_buffer      = true,
    no_buffers         = true,
    draw_borders       = false,
    draw_outline       = false,
    draw_shades        = false,

    -- Colours
    default_color = '1A3520',
};

conky.text = [[
${color 005500}── i3 keys ─────────────────────────${color}

${color 009900}Apps${color}
  Super + Enter        terminal
  Super + D            launcher

${color 009900}Windows${color}
  Super + Q            close
  Super + F            fullscreen
  Super + H            split side by side
  Super + V            split top / bottom

${color 009900}Focus${color}
  Super + ←↑↓→         focus window

${color 009900}Move${color}
  Super + Shift + ←↑↓→  move window

${color 009900}Layout${color}
  Super + S            stacking
  Super + W            tabbed
  Super + E            split toggle
  Super + Space        toggle focus float
  Super + Shift+Space  toggle floating

${color 009900}Workspaces${color}
  Super + 1–5          switch workspace
  Super + Shift + 1–5  move to workspace

${color 009900}Resize  (Super + R)${color}
  ←↑↓→                 resize window
  Enter / Esc          exit resize

${color 009900}Session${color}
  Super + Shift + R    restart i3
  Super + Shift + E    exit i3
]];
