# Alacritty config — Burning Amber CRT theme

[general]
import = ["~/.config/alacritty/live-theme.toml"]

[font]
normal = { family = "BlexMono Nerd Font", style = "Regular" }
bold   = { family = "BlexMono Nerd Font", style = "Bold" }
italic = { family = "BlexMono Nerd Font", style = "Italic" }
size   = 8.0

[terminal.shell]
program = "/run/current-system/sw/bin/zsh"

[window]
padding        = { x = 8, y = 8 }
decorations    = "None"
opacity        = 0.80