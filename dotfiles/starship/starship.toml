"$schema" = 'https://starship.rs/config-schema.json'

format = """$os$directory$git_branch$git_status$nodejs$python$dotnet$rust$cmd_duration$status$line_break$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
format = "[$symbol ]($style)"
style = "fg:overlay1"

[directory]
format = "[$path ]($style)"
style = "fg:lavender"
truncation_length = 4
truncate_to_repo = true

[git_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "fg:mauve"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:peach"

[nodejs]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:green"

[python]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:yellow"

[dotnet]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:blue"

[rust]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:peach"

[cmd_duration]
min_time = 2_000
format = "[took $duration ]($style)"
style = "fg:yellow"

[status]
disabled = false
format = "[$symbol$status ]($style)"
symbol = "✘ "
success_symbol = ""
style = "fg:red"

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
